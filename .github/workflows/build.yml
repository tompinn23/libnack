name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xcb + wayland
            flags: ""
          - name: xcb only
            flags: "-DNACK_ENABLE_WAYLAND=OFF"
          - name: wayland only
            flags: "-DNACK_ENABLE_XCB=OFF"
          - name: pure xcb (no Xlib fallback)
            flags: "-DNACK_ENABLE_WAYLAND=OFF -DNACK_XCB_XLIB_FALLBACK=OFF"
    name: linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libegl-dev libgl-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build

  linux-run:
    runs-on: ubuntu-latest
    name: linux (headless smoke test)
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build xvfb libgl1-mesa-dri \
            libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libegl-dev libgl-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Run tests and examples under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ctest --test-dir build --output-on-failure
          # Each example is started, given time to create a window and render,
          # then stopped; a crash or a failed context shows up as a non-zero
          # exit before the timeout fires.
          for example in hello roguelike; do
            echo "== $example =="
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              timeout --preserve-status 10 ./build/examples/$example \
              && status=$? || status=$?
            # 124/143 mean the timeout stopped a healthy program.
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 143 ]; then
              echo "$example exited with $status"
              exit 1
            fi
          done

  # The Wayland backend had no test coverage at all: every job either built
  # it without running it, or ran under Xvfb, which selects X11. A headless
  # Weston is a real compositor, so the whole backend - surface, xdg-shell,
  # EGL, the event loop - is exercised here rather than only compiled.
  linux-wayland:
    name: linux (headless wayland)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build weston libgl1-mesa-dri libegl-mesa0 \
            libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libegl-dev libgl-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          cmake --build build
      - name: Run the smoke test against a headless compositor
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -u
          XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          weston --backend=headless --socket=wayland-ci \
                 --width=1280 --height=1024 >weston.log 2>&1 &
          weston_pid=$!
          # Wait for the socket, rather than guessing how long Weston takes.
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break
            sleep 0.2
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
            echo "weston did not come up:"; cat weston.log; exit 1
          fi
          # No DISPLAY, so the library has to choose Wayland.
          unset DISPLAY
          status=0
          WAYLAND_DISPLAY=wayland-ci ./build/nack_smoke || status=$?
          kill "$weston_pid" 2>/dev/null || true
          # 77 is the test's "no display" skip. Here that would mean the job
          # ran nothing, which is the one outcome it exists to rule out.
          if [ "$status" -eq 77 ]; then
            echo "the smoke test skipped itself under Weston:"; cat weston.log
            exit 1
          fi
          exit "$status"

  # The C++ header is a RAII wrapper, so a leak or a double free in it is a
  # defect in the thing itself. This job is what found the built-in font's
  # atlas leaking at shutdown.
  linux-sanitizers:
    name: linux (asan, ubsan, lsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-xcb-dev libxcb-xkb-dev \
            libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev \
            xvfb mesa-utils
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build -j
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      # The hand-rolled Win32 declarations are only safe if they agree with
      # the SDK, so the comparison runs on every build.
      - name: Check Win32 ABI against the SDK
        run: ctest --test-dir build -C Release -R win32_abi --output-on-failure
      # The runner has no GPU, so Windows falls back to the GDI generic
      # renderer, which is OpenGL 1.1 and has no WGL_ARB_create_context: no
      # 3.3 context can exist on it and the console renderer cannot run at
      # all. Mesa's llvmpipe is a real 3.3 implementation in software, so
      # dropping it next to the test binaries is what gives the Win32
      # renderer any runtime coverage. opengl32.dll is only the ICD shim;
      # libgallium_wgl.dll is the driver behind it.
      - name: Install Mesa (software OpenGL 3.3)
        shell: pwsh
        run: |
          $version = "26.2.0"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z e mesa.7z -omesa `
            x64/opengl32.dll x64/libgallium_wgl.dll x64/dxil.dll -y
          Copy-Item mesa/*.dll build/Release/
      - name: Test
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Mesa is installed above so that the renderer actually runs here.
          # ctest counts a skip as success, so the smoke test is run once
          # more directly: exit 77 means it found no renderer, which now
          # means the Mesa step silently did not take effect.
          $env:NACK_DEBUG = "1"
          & ./build/Release/nack_smoke.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "smoke test exited $LASTEXITCODE (77 = no renderer found)"
            exit 1
          }

  windows-sdk-headers:
    name: windows (windows.h fallback)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNACK_WIN32_USE_SDK_HEADERS=ON
      - name: Build
        run: cmake --build build --config Release

  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles"
      - name: Build
        run: cmake --build build
      - name: Check Win32 ABI against the SDK
        run: ctest --test-dir build -R win32_abi --output-on-failure

  macos:
    name: macos (metal, opengl fallback compiled in)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      # Neither the author nor CI has a Mac to develop on, so running the
      # smoke test here is the only thing that ever executes the Metal path.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-opengl:
    name: macos (opengl only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DNACK_MACOS_OPENGL_ONLY=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
